apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriassist-api
  labels:
    app: agriassist-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agriassist-api
  template:
    metadata:
      labels:
        app: agriassist-api
    spec:
      containers:
      - name: api
        image: agriassist/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: agriassist-secrets
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/system/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/system/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agriassist-api-service
spec:
  type: ClusterIP
  selector:
    app: agriassist-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
