apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriassist-web
  labels:
    app: agriassist-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agriassist-web
  template:
    metadata:
      labels:
        app: agriassist-web
    spec:
      containers:
      - name: web
        image: agriassist/web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.agriassist.com"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agriassist-web-service
spec:
  type: ClusterIP
  selector:
    app: agriassist-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
