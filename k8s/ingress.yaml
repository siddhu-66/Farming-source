apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agriassist-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - agriassist.com
    - api.agriassist.com
    secretName: agriassist-tls
  rules:
  - host: agriassist.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agriassist-web-service
            port:
              number: 80
  - host: api.agriassist.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agriassist-api-service
            port:
              number: 80
